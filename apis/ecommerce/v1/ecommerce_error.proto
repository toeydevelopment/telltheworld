syntax = "proto3";

package ecommerce.v1;

import "errors/errors.proto";

option go_package = "github.com/toeydevelopment/telltheworld/apis/ecommerce/v1;v1";
option java_multiple_files = true;
option java_package = "api.ecommerce.v1";

enum ErrorCode {
  option (errors.default_code) = 500;

  UNKNOWN = 0 [(errors.code) = 500];
  INVALID_REQUEST = 1 [(errors.code) = 400];
  USER_NOT_FOUND = 2 [(errors.code) = 404];
  ORDER_NOT_FOUND = 3 [(errors.code) = 404];
  NOTIFICATION_FAILED = 4 [(errors.code) = 500];
  TELLER_SERVICE_UNAVAILABLE = 5 [(errors.code) = 503];
}
