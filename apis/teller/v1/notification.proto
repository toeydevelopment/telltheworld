syntax = "proto3";

package teller.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";
option go_package = "github.com/toeydevelopment/telltheworld/apis/teller/v1;v1";

message Notification {
    string title = 1 [(validate.rules).string = {min_len: 1, max_len: 255}];
    string body = 2 [(validate.rules).string = {min_len: 1, max_len: 10000}];
    string ref_id = 3 [(validate.rules).string = {min_len: 1, max_len: 50}];
    repeated NotificationChannel channels = 4 [(validate.rules).repeated.items.enum = {in: [1, 2]}];
    // google.protobuf.Timestamp created_at = 4 [json_name = "created_at"];
    // google.protobuf.Timestamp send_at = 5 [json_name = "send_at"];
    optional google.protobuf.Timestamp schedule_at = 6 [json_name = "schedule_at", (validate.rules).timestamp.gt_now = true];
}

enum NotificationChannel {
    NotificationChannel_Unknown = 0;
    NotificationChannel_Push = 1;
    NotificationChannel_Email = 2;
}

message StatusPerChannel {
    NotificationChannel channel = 1 [(validate.rules).enum = {in: [1, 2]}];
    NotificationStatus status = 2 [(validate.rules).enum = {in: [1, 2, 3]}];
    optional string fail_reason = 3 [(validate.rules).string = {min_len: 1, max_len: 1000}];
    optional google.protobuf.Timestamp completed_at = 4;
}

message WillPushReply {
    string notification_id = 1;
}

service NotificationService {
   rpc Boardcast(BoardcastRequest) returns (google.protobuf.Empty) {

   }
   rpc SendToUser(SendToUserRequest) returns (WillPushReply) {

   }
   rpc BulkSendToUser(BulkSendToUserRequest) returns (BulkSendToUserReply) {

   }

   rpc GetNotificationStatus(GetNotificationStatusRequest) returns (GetNotificationStatusReply) {

   }
}

message BoardcastRequest {
    Notification notification = 1;
}

message ChannelDestination {
    NotificationChannel channel = 1 [(validate.rules).enum = {in: [1, 2]}];
    string destination = 2 [(validate.rules).string = {min_len: 1, max_len: 255}];
}

message SendToUserRequest {
    Notification notification = 1;
    repeated ChannelDestination destinations = 2 [(validate.rules).repeated = {min_items: 1}];
}

message BulkSendToUserRequest {
    repeated SendToUserRequest requests = 1;
}

message BulkSendToUserReply {
    repeated WillPushReply replies = 1;
}

message GetNotificationStatusRequest {
    string notification_id = 1 [(validate.rules).string = {min_len: 1, max_len: 50}];
}

message GetNotificationStatusReply {
    message StatusPerChannel {
        NotificationChannel channel = 1 [(validate.rules).enum = {in: [1, 2]}];
        NotificationStatus status = 2 [(validate.rules).enum = {in: [1, 2, 3]}];
        optional string fail_reason = 3 [(validate.rules).string = {min_len: 1, max_len: 1000}];
        optional google.protobuf.Timestamp completed_at = 4;
    }
    repeated StatusPerChannel statuses = 1;
}

enum NotificationStatus {
    NotificationStatus_Unknown = 0;
    NotificationStatus_Pending = 1;
    NotificationStatus_Sent = 2;
    NotificationStatus_Failed = 3;
}
